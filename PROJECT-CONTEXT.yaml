open_questions:
  - id: q-which-server
    question: Which process should the browser call, server/server.js, server/src/index.ts, or neither?
    why_it_matters: Wiring the client to a guessed server freezes the wrong mint.
    blocks: cap-client-mint
  - id: q-network
    question: Is the chain Hardhat on localhost:8545, or a public network?
    why_it_matters: The committed address is only meaningful on a Hardhat node that deployed first from account zero.
    blocks: cap-contract
  - id: q-svg-is-product
    question: Should Create keep drawing SVG offline, with the TensorFlow file treated as an experiment?
    why_it_matters: The homepage claims a trained model the client does not use.
    blocks: cap-ai-model
  - id: q-vercel
    question: Is neural-nft.vercel.app a deploy that should be documented?
    why_it_matters: deployment.md names it and README.md does not. This audit did not request the URL.
    blocks: cap-deploy
  - id: q-audience
    question: Who must believe the demo, a class, a hiring manager, or a user who pays gas?
    why_it_matters: Those audiences forgive different mocks.
    blocks: null
  - id: q-feat-002
    question: Should feat-002 stay in_progress until a server is chosen?
    why_it_matters: The spec says the boot path is unconfirmed.
    blocks: null
  - id: q-delete-server
    question: After a server is chosen, may the other server be deleted?
    why_it_matters: CASE-STUDY wishes it had been deleted. This audit must not delete it.
    blocks: null
  - id: q-mock-wallet
    question: Is the mock wallet the finished wallet for this portfolio?
    why_it_matters: No window.ethereum exists, and no spec says to add it.
    blocks: cap-client-wallet

roadmap:
  - id: road-1
    item: Owner answers which server is canonical, or confirms the client mock is the product.
    blocked_by: q-which-server
  - id: road-2
    item: Point the client at that choice so mint and My NFTs share one store.
    blocked_by: road-1
  - id: road-3
    item: If the monolith is chosen, fix the contractAddress log export and replace the relative token URI.
    blocked_by: road-1
  - id: road-4
    item: If the modular server is chosen, import ethers.utils.isAddress and replace the stubs that should be real.
    blocked_by: road-1
  - id: road-5
    item: Record a contract address from a deploy log on a named network.
    blocked_by: q-network
  - id: road-6
    item: Add one test, then set project.yaml test to that command and add a verification row.
    blocked_by: null
  - id: road-7
    item: Marketplace buttons call a handler only after the loop shares a store.
    blocked_by: road-2

