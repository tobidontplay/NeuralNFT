architecture:
  summary: >
    Three programs share names and types and do not share a running loop.
    The Vite client is the only process the root dev script starts.
  style: monorepo with two unused backends
  entry_points:
    - id: client
      command: npm run dev
      file: src/main.tsx
      port: null
    - id: server-js
      command: npm run server
      cwd: server
      file: server/server.js
      port: 5000
    - id: server-ts
      command: npm run dev
      cwd: server
      file: server/src/index.ts
      port: 5000
  components:
    - id: pages
      path: src/pages
      role: Home, create, gallery, my NFTs
    - id: wallet-context
      path: src/context/WalletContext.tsx
      role: Mock wallet state
    - id: svg-generator
      path: src/utils/artGenerator.ts
      role: Browser SVG
    - id: monolith
      path: server/server.js
      role: RAM API plus chain mint
    - id: modules
      path: server/src
      role: RAM API with marketplace-shaped routes
    - id: contract
      path: server/contracts/NeuralNFT.sol
      role: ERC-721 plus fees
  data_flow: >
    Create calls generateArt in the browser and mintNFT in the same module.
    My NFTs reads mockNFTs. No fetch crosses to Express.
    server.js would mint through contractInteraction.js only after Hardhat and the model initialize.
  client_calls_api: false
  canonical_server: null

risks:
  - id: r-unwired-loop
    severity: high
    statement: Mint success does not update My NFTs, and the client calls no API.
    evidence: src/utils/mockData.ts
    confidence: high
  - id: r-two-servers
    severity: high
    statement: Two servers default to port 5000 and implement different mints. Neither is chosen.
    evidence: server/server.js
    confidence: high
  - id: r-ethers-import
    severity: high
    statement: Modular routes import isAddress from ethers 5.7.2, whose published types do not export that name.
    evidence: server/src/controllers/nft.controller.ts
    confidence: high
  - id: r-stylegan-name
    severity: high
    statement: The model is a dense stack with no fit call, presented by class name as StyleGAN.
    evidence: server/ai/model.js
    confidence: high
  - id: r-token-uri
    severity: high
    statement: Mint metadata URI is a relative uploads path, not a public or IPFS URI.
    evidence: server/server.js
    confidence: high
  - id: r-server-signer-creator
    severity: high
    statement: Contract creator is msg.sender. The monolith signs with the first Hardhat account.
    evidence: server/contracts/NeuralNFT.sol
    confidence: high
  - id: r-auth-stub
    severity: high
    statement: Signature verification returns true and mint does not check the signature.
    evidence: server/src/services/wallet.service.ts
    confidence: high
  - id: r-no-tests
    severity: high
    statement: No tests and an empty verification log.
    evidence: docs/verification.md
    confidence: high
  - id: r-private-counter
    severity: medium
    statement: getNFTsByOwner calls _tokenIds, which is private and absent from the ABI. No route calls it.
    evidence: server/blockchain/contractInteraction.js
    confidence: high
  - id: r-zero-key-default
    severity: medium
    statement: env.ts defaults PRIVATE_KEY to 64 zero hex digits. Current services do not pass it to a signer.
    evidence: server/src/config/env.ts
    confidence: high
  - id: r-weights-provenance
    severity: medium
    statement: weights.bin may or may not be initializer output. No training script is in the repo.
    evidence: server/ai/model.js
    confidence: medium
  - id: r-address-liveness
    severity: low
    statement: contract-address.json holds the usual first Hardhat address. No node was queried.
    evidence: server/contractData/contract-address.json
    confidence: low

