teaching_hooks:
  - id: h-three-programs
    audience: owner
    concept: A repository can contain three programs that share a name and do not share a call.
    hook: The mint button says success, and the next page has never heard of that token.
  - id: h-read-the-function
    audience: owner
    concept: Marketing copy is not an architecture diagram.
    hook: The home page says the model was trained on millions of images. The function draws fifty random circles.
  - id: h-ethers-major
    audience: tutor
    concept: A named import can fail when the lockfile is a different major version.
    hook: isAddress is real in ethers. The lockfile is ethers 5.7.2, and that package's type entry does not export the name.
  - id: h-creator-is-sender
    audience: tutor
    concept: msg.sender is the account that sent the transaction, not the recipient argument.
    hook: The server mints to your address and the contract records the server as the artist.
  - id: h-basis-points
    audience: owner
    concept: 250 basis points is 2.5 percent because the denominator is 10000.
    hook: The fee looks like 250 until you divide by 10000.
  - id: h-frontmatter
    audience: agent
    concept: status Done in prose is weaker than verified_by null in frontmatter.
    hook: feat-001 says Done and also says nobody verified it.
  - id: h-blocking-gap
    audience: tutor
    concept: The blocking gap is the broken shared store, not the missing test suite.
    hook: Tests would not make View in My Collection show a token the array never received.
